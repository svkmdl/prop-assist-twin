[project]
name = "backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "boto3>=1.42.69",
    "fastapi>=0.135.1",
    "mangum>=0.21.0",
    "pypdf>=6.9.0",
    "python-dotenv>=1.2.2",
    "python-multipart>=0.0.22",
    "uvicorn>=0.41.0",
    "pytest>=9.0.0",
    "httpx>=0.28.1",
    "langchain-text-splitters>=1.1.2",
    "rank-bm25>=0.2.2",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = ["lambda-package", ".venv", ".git"]
addopts = "--cov=server --cov=common --cov=ingestion --cov-report=term-missing"

[tool.coverage.run]
source = ["server", "common", "ingestion"]
omit = ["lambda-package/*", "tests/*"]

[tool.coverage.report]
show_missing = true
fail_under = 90

[dependency-groups]
dev = [
    "pytest-cov>=7.1.0",
]
